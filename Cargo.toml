[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license-file = "LICENSE"

[workspace.dependencies]
proto = { path = "crates/proto" }
e2e = { path = "crates/e2e" }
server = { path = "crates/server" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
snow = "0.10.0"
zeroize = "1.9.1"
libc = "0.2.191"
windows-sys = "0.59.0"
ratatui = "0.29.0"
crossterm = { version = "0.28.1", features = ["event-stream"] }
# ratatui 0.29 pins unicode-width =0.2.0
unicode-width = "=0.2.0"
thiserror = "2.0.21"
rand = "0.10.3"
chacha20poly1305 = { version = "0.10.1", features = ["getrandom"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
